# TrimReaper CUDA config — serious proof-of-concept run on Qwen3-4B-Base.
#
# Focus: does pairwise Givens rotation help channel pruning at MEANINGFUL
# compression (not the token 32-channel case)? Default deletes 512 / 9728
# channels (~5.3%) of layer 18's MLP and compares GA+rotations vs GA-no-rot
# vs the three one-shot baselines, each also reported on an untouched test set.
#
# Rotation semantics: the Givens composition is applied to the POST-SwiGLU
# hidden activation (x@Q) with down_proj counter-rotated, so with no mask the
# transform is EXACTLY function-preserving (this is the corrected, meaningful
# version — the old gate/up-row rotation was NOT invariant under SiLU).
#
# Validation and test come from WikiText's OWN validation/test splits, so they
# are genuinely disjoint from the train-based fitness pool.
#
# Launch on a machine where the GPU is actually visible:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#   .venv/bin/python -m trimreaper.cli --config configs/cuda_full.yaml run
#
# Fixed-target curve (recommended workflow) — re-run with a different target:
#   --search.start_target=256 --search.max_target=256
#   --search.start_target=512 --search.max_target=512
#   --search.start_target=1024 --search.max_target=1024
# (start==max disables the ratchet; one level is searched for `rounds` gens.)
# Add --ga.seed=1 / 2 / 3 for independent seeds.

model:
  model_id: "Qwen/Qwen3-4B-Base"
  dtype: "bfloat16"
  device: "cuda"            # pinned to GPU — do not auto-fall back to CPU
  low_cpu_mem_usage: true
  layers: [18]              # single middle layer for the first POC (PLAN sec 5)

data:
  dataset: "Salesforce/wikitext"
  dataset_config: "wikitext-103-raw-v1"
  split: "train"            # fitness pool (WikiText train)
  seq_len: 256              # random contiguous token windows (PLAN sec 8)
  fit_batch: 4              # 4 sequences x 256 tokens per fitness forward
  holdout_seq: 128          # VALIDATION set (WikiText 'validation' split; search picks records on it)
  test_seq: 64              # untouched TEST set (WikiText 'test' split; final report only)
  num_workers: 2
  seed: 0
  max_docs: 2000            # 0 = unlimited; caps CPU-bound wikitext tokenization

genome:
  min_rotations: 256                # rotation-budget floor (see rotations_per_removed)
  max_rotations: 4096               # rotation-budget ceiling
  rotations_per_removed: 1.0        # budget = clamp(rpr*target, 256, 4096)
                                    #   target=512 -> 512, 1024 -> 1024, 2048 -> 2048
  min_angle: -6.283185307179586    # +/- 2pi
  max_angle: 6.283185307179586
  delete_survive_bias: 0.95         # STRONGLY prefer deleted<->kept (cross-boundary) rotations
                                    # Every genome has EXACTLY rotation_budget(target) rotations
                                    # (fixed count — directly comparable, no add/remove drift).

ga:
  population: 64            # independent explorers (each self-mutates, no crossover)
  elitism: 1
  tournament_size: 2          # for REBASING a stuck explorer (best of k bases)
  # Independent-explorer mode: a candidate that goes this many consecutive
  # generations without beating the global elite gets re-based (copy+mutate a
  # tournament-selected base) and starts a fresh search path.
  fail_limit: 5
  seed: 42

mutation:
  # Per-explorer assigned ANGLE-mutation fraction, linearly spaced across the
  # population from min to max (cautious -> aggressive). Fixed per slot, survives
  # re-basing; the end report shows which angle rates produce wins. ANGLE mutation
  # happens 100% of the time — the fraction controls HOW MANY angles change/gen.
  angle_fraction_min: 0.003      # ~1 angle on a 440-rotation genome
  angle_fraction_max: 0.08       # ~44 angles on a 440-rotation genome
  # PAIR rewire: fraction of rotations whose (a,b) endpoints get re-drawn as a
  # fresh pruned<->kept pair each generation (same rate for every explorer).
  pair_rewire_fraction: 0.04
  # MASK mutation: with mask_swap_probability, swap mask_swap_count pruned
  # channels for kept ones per generation (exact swap preserves the target).
  mask_swap_count: 1
  mask_swap_probability: 0.20
  # Angle-change distribution: small Gaussian bump, occasional large jump.
  angle_std: 0.15
  large_angle_probability: 0.05
  large_angle_std: 1.0

analysis:
  # Analytical pre-analysis for the fixed-mask 'rotation extraction' experiment
  # (CLI `extract`): Wanda-style importance E[h_i^2]*||W_down[:,i]||^2, then the
  # target weakest channels become the FIXED mask (dead channels included), and
  # a greedy local-PCA Givens basis is built on max_rows hidden rows. The GA is
  # then seeded (exact + small + large mutations) from that analytical solution.
  max_rows: 2048          # hidden rows subsampled for the PCA covariance (0=all)
  skip_bottom: 0          # skip N very-weakest channels in the mask (0 = include them)
  n_exact: 1              # GA-seed tiers around the analytical solution
  n_small: 8
  n_large: 8

search:
  # We are collecting the KL-vs-removed CURVE, NOT gatekeeping on epsilon yet.
  # Set epsilon high so every target level records instead of being rejected.
  epsilon: 0.5
  rounds: 50                # generations at the fixed target (per GA method)
  valid_best_k: 3           # top-K (by fitness) candidates validation-scored each gen
  start_target: 512         # fixed level: delete 512/9728 channels (~5.3%)
  ratchet_step: 256         # unused while start==max; used only if ratcheting
  max_target: 512           # == start_target => single fixed level, no ratchet
  penalty_scale: 10.0
  archive_dir: "runs/archive"
  use_fast_eval: true       # cache pre-MLP prefix + batched tail (major speedup)
  fast_eval_chunk: 0        # 0 = AUTO-size tails from free VRAM (no OOM); or set 1/2/4/8 explicitly
