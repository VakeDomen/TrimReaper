[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trimreaper"
version = "0.1.0"
description = "Evolutionary MLP width-pruning for Qwen models (proof-of-concept)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate>=0.29",
    "datasets>=2.18",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
trimreaper = "trimreaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
